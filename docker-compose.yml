version: "3.9"

services:
  # ============================================================
  # Scheduler: corre los scrapers + alertas en background
  # ============================================================
  scheduler:
    build: .
    container_name: ai_scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_ENABLED: "false"
    command: python scheduler.py

  # ============================================================
  # Dashboard Streamlit
  # ============================================================
  dashboard:
    build: .
    container_name: ai_dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      - scheduler

  # Ollama deshabilitado — activar cuando haya espacio en disco suficiente (4GB+)
  # ollama:
  #   image: ollama/ollama:latest
  #   ...
